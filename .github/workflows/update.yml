name: Update Orca

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Pin to a specific version (leave empty for latest stable)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@v14

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Save old version
        run: |
          OLD=$(jq -r .version pkgs/orca/version.json)
          echo "OLD=$OLD" >> "$GITHUB_ENV"

      - name: Run update script
        env:
          ORCA_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$ORCA_VERSION" ]]; then
            ./scripts/update.sh "$ORCA_VERSION"
          else
            ./scripts/update.sh
          fi

      - name: Save new version
        run: |
          NEW=$(jq -r .version pkgs/orca/version.json)
          echo "NEW=$NEW" >> "$GITHUB_ENV"

      - name: Build and verify
        if: env.OLD != env.NEW || github.event_name == 'push'
        run: |
          nix build .#orca
          DESKTOP=./result/share/applications/orca.desktop
          ACTUAL=$(sed -n 's/^X-AppImage-Version=//p' "$DESKTOP")
          echo "Built AppImage version: $ACTUAL"
          if [[ "$ACTUAL" != "$NEW" ]]; then
            echo "::error::Version mismatch: expected $NEW, got $ACTUAL"
            exit 1
          fi
          grep -q '^Exec=orca %U$' "$DESKTOP"

      - name: Commit and push
        if: env.OLD != env.NEW
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/orca/version.json
          git commit -m "orca: $OLD → $NEW"
          git push
